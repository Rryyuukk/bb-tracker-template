<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>BB Tracker · Dashboard</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel2: #1a2234; --line: #232c40;
    --text: #e6edf6; --muted: #8a97ad; --accent: #5b8cff; --accent2: #36d399;
    --warn: #fbbf24; --bad: #f87171;
    --sidebar-w: 230px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  .hidden { display: none !important; }

  /* ── Login ── */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    z-index: 20;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px; width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .card h1 { font-size: 18px; margin: 0 0 4px; }
  .card p { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  input[type=password], input[type=number], select {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    cursor: pointer; border: none; border-radius: 9px; padding: 10px 14px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ── App layout: sidebar + content ── */
  #app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 14px;
    position: sticky; top: 0; height: 100vh;
  }
  .sidebar .brand { font-weight: 700; letter-spacing: .3px; font-size: 16px; padding: 4px 10px 18px; }
  .sidebar .brand span { color: var(--accent); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    text-align: left; width: 100%;
    background: transparent; color: var(--muted); font-weight: 600; font-size: 13px;
    border: 1px solid transparent; border-radius: 9px; padding: 9px 11px;
  }
  .nav-item:hover { background: var(--panel2); color: var(--text); }
  .nav-item.active { background: var(--panel2); color: var(--text); border-color: var(--line); }
  .nav-item .ic { width: 18px; text-align: center; opacity: .85; }
  .nav .group-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .7px; padding: 14px 11px 6px; }
  .sidebar .spacer { flex: 1; }
  .sidebar .foot { border-top: 1px solid var(--line); padding-top: 12px; }
  .sidebar .foot .meta { color: var(--muted); font-size: 11px; padding: 0 11px 8px; }

  .content { flex: 1; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar .title { font-weight: 700; font-size: 15px; }
  .topbar .sub { color: var(--muted); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .topbar label.meta { color: var(--muted); font-size: 12px; }
  main { padding: 22px; max-width: 1180px; margin: 0 auto; }

  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(4, 1fr); }
  .cards3 { grid-template-columns: repeat(3, 1fr); }
  .two { grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 900px) {
    .sidebar { position: static; width: 100%; height: auto; flex-basis: auto; flex-direction: column; }
    #app { flex-direction: column; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav .group-label { display: none; }
    .cards, .cards3 { grid-template-columns: repeat(2,1fr); }
    .two { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 14px; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .sublabel { color: var(--muted); font-size: 11px; margin-top: 4px; }

  /* funnel */
  .funnel-row { margin-bottom: 12px; }
  .funnel-row:last-child { margin-bottom: 0; }
  .funnel-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .funnel-head .lbl { color: var(--text); }
  .funnel-head .val { color: var(--muted); }
  .bar { height: 26px; background: var(--panel2); border-radius: 7px; overflow: hidden; }
  .bar > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), #7aa2ff);
    border-radius: 7px; transition: width .4s ease;
  }
  .drop { font-size: 11px; color: var(--warn); margin-top: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .ts { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev { font-weight: 600; }
  .feed-wrap { max-height: 420px; overflow: auto; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .spark > div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .notice { color: var(--muted); font-size: 13px; padding: 18px; text-align: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); display: inline-block; margin-right: 6px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* phase-2 empty state */
  .coming {
    border: 1px dashed var(--line); border-radius: 10px; padding: 22px;
    text-align: center; color: var(--muted); background: rgba(91,140,255,.04);
  }
  .coming .tag {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--accent); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; margin-bottom: 10px; background: var(--panel2);
  }
  .coming .t { color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .section-gap { margin-bottom: 16px; }
</style>
</head>
<body>

<!-- ── Login overlay ── -->
<div id="login">
  <form class="card" id="loginForm">
    <h1>BB Tracker</h1>
    <p>Enter the dashboard password to continue.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
    <div class="err" id="loginErr"></div>
    <button type="submit" id="loginBtn" style="width:100%; margin-top:8px;">Sign in</button>
  </form>
</div>

<!-- ── App ── -->
<div id="app" class="hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">BB<span>·</span>Tracker</div>
    <nav class="nav" id="nav">
      <div class="group-label">Analytics</div>
      <button class="nav-item active" data-view="overview"><span class="ic">◧</span> Overview</button>
      <button class="nav-item" data-view="advertorial"><span class="ic">▤</span> Advertorial</button>
      <button class="nav-item" data-view="funnel"><span class="ic">⛛</span> Funnel / Scroll</button>
      <button class="nav-item" data-view="campaigns"><span class="ic">◎</span> Campaigns</button>
      <button class="nav-item" data-view="sales"><span class="ic">$</span> Sales</button>
    </nav>
    <div class="spacer"></div>
    <div class="foot">
      <div class="meta" id="sideMeta">—</div>
      <button class="ghost" id="logoutBtn" style="width:100%;">Log out</button>
    </div>
  </aside>

  <!-- Content -->
  <div class="content">
    <div class="topbar">
      <div>
        <div class="title" id="viewTitle">Overview</div>
        <div class="sub" id="rangeMeta"></div>
      </div>
      <div class="spacer"></div>
      <label class="meta" for="days">Range</label>
      <select id="days" style="width:auto;">
        <option value="1">24h</option>
        <option value="7" selected>7 days</option>
        <option value="14">14 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
      </select>
      <button class="ghost" id="refreshBtn">Refresh</button>
    </div>

    <main>
      <div id="dataErr" class="panel hidden" style="border-color:#5a2330;background:#241319;color:#f8b7c0;margin-bottom:16px;"></div>

      <!-- Views -->
      <section class="view" data-view="overview" id="view_overview"></section>
      <section class="view hidden" data-view="advertorial" id="view_advertorial"></section>
      <section class="view hidden" data-view="funnel" id="view_funnel"></section>
      <section class="view hidden" data-view="campaigns" id="view_campaigns"></section>
      <section class="view hidden" data-view="sales" id="view_sales"></section>
    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return (n == null ? '—' : Number(n).toLocaleString()); };
  var money = function (n) {
    return (n == null ? '—' : Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  };
  var loginEl = $('login'), appEl = $('app');
  var feedTimer = null;

  // In-memory cache so switching views doesn't refetch.
  var state = { stats: null, feed: null, campaigns: null, view: 'overview' };

  var VIEW_TITLES = {
    overview: 'Overview',
    advertorial: 'Advertorial',
    funnel: 'Funnel / Scroll',
    campaigns: 'Campaigns',
    sales: 'Sales',
  };

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // ── Auth ──
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn'); btn.disabled = true; $('loginErr').textContent = '';
    fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) { enterApp(); }
        else { $('loginErr').textContent = res.j.error || 'Login failed'; }
      })
      .catch(function () { $('loginErr').textContent = 'Network error'; })
      .finally(function () { btn.disabled = false; });
  });

  $('logoutBtn').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST' }).finally(function () { location.reload(); });
  });

  $('refreshBtn').addEventListener('click', loadAll);
  $('days').addEventListener('change', loadAll);

  // ── Sidebar navigation ──
  $('nav').addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-item');
    if (!btn) return;
    setView(btn.getAttribute('data-view'));
  });

  function setView(v) {
    if (!VIEW_TITLES[v]) v = 'overview';
    state.view = v;
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-view') === v);
    }
    var views = document.querySelectorAll('.view');
    for (var j = 0; j < views.length; j++) {
      views[j].classList.toggle('hidden', views[j].getAttribute('data-view') !== v);
    }
    $('viewTitle').textContent = VIEW_TITLES[v];
    renderActiveView();
  }

  function enterApp() {
    hide(loginEl); show(appEl);
    setView(state.view);
    loadAll();
    if (feedTimer) clearInterval(feedTimer);
    feedTimer = setInterval(loadFeed, 10000); // live feed every 10s
  }

  function showDataErr(msg) {
    var el = $('dataErr');
    if (!msg) { hide(el); return; }
    el.textContent = msg; show(el);
  }

  // ── Data ──
  function loadAll() {
    var days = $('days').value;
    $('rangeMeta').textContent = 'last ' + days + 'd';
    $('sideMeta').textContent = 'Window: last ' + days + ' days';
    showDataErr('');
    fetch('/api/dashboard/stats?days=' + days)
      .then(function (r) {
        if (r.status === 401) { location.reload(); throw new Error('unauth'); }
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (!res.ok) { showDataErr(errText(res.j)); return; }
        state.stats = res.j;
        renderActiveView();
      })
      .catch(function (e) { if (e.message !== 'unauth') showDataErr('Failed to load stats.'); });
    loadFeed();
    loadCampaigns();
  }

  // Loads the Meta-spend ⨝ PostHog-revenue join for the Campaigns + Sales views.
  // Only fetched on explicit load/refresh/range-change (never on the 10s feed
  // timer) since it hits the Meta Marketing API.
  function loadCampaigns() {
    var days = $('days').value;
    state.campaigns = null;
    if (state.view === 'campaigns' || state.view === 'sales') renderActiveView();
    fetch('/api/dashboard/campaign-roas?days=' + days)
      .then(function (r) {
        if (r.status === 401) { location.reload(); throw new Error('unauth'); }
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        state.campaigns = res.ok ? res.j : { error: res.j.error || 'Error', hint: res.j.hint, detail: res.j.detail };
        if (state.view === 'campaigns' || state.view === 'sales') renderActiveView();
      })
      .catch(function (e) {
        if (e.message === 'unauth') return;
        state.campaigns = { error: 'Failed to load campaign spend.' };
        if (state.view === 'campaigns' || state.view === 'sales') renderActiveView();
      });
  }

  function errText(j) {
    if (!j) return 'Unknown error';
    if (j.hint) return j.error + ' — ' + j.hint;
    var d = j.detail ? (typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail)) : '';
    return (j.error || 'Error') + (d ? ' — ' + d : '');
  }

  function loadFeed() {
    fetch('/api/dashboard/events?limit=100')
      .then(function (r) {
        if (r.status === 401) { location.reload(); throw new Error('unauth'); }
        return r.json();
      })
      .then(function (j) {
        state.feed = j.events || [];
        renderActiveView();
      })
      .catch(function () {});
  }

  // ── Small helpers ──
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function timeAgo(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return iso || '';
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return new Date(t).toLocaleDateString();
  }
  // Look up a single event's count from the byEvent breakdown.
  function eventCount(d, name) {
    var arr = (d && d.byEvent) || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].event === name) return arr[i].count;
    return 0;
  }
  // Find a funnel stage by key.
  function funnelStage(d, key) {
    var arr = (d && d.funnel) || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].key === key) return arr[i];
    return null;
  }
  function statCard(label, value, sub) {
    return '<div class="panel stat"><div class="l">' + esc(label) + '</div>' +
      '<div class="n">' + (value == null ? '—' : esc(String(value))) + '</div>' +
      (sub ? '<div class="sublabel">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function comingSoon(title, msg) {
    return '<div class="coming"><div class="tag">Phase 2 data</div>' +
      '<div class="t">' + esc(title) + '</div><div>' + esc(msg) + '</div></div>';
  }
  function funnelHTML(f) {
    if (!f || !f.length) return '<div class="notice">No funnel data.</div>';
    return f.map(function (s, i) {
      var drop = (i > 0 && s.pctOfPrev < 100)
        ? '<div class="drop">' + s.pctOfPrev + '% of previous step</div>' : '';
      return '<div class="funnel-row">' +
        '<div class="funnel-head"><span class="lbl">' + esc(s.label) + '</span>' +
        '<span class="val">' + fmt(s.count) + ' · ' + s.pctOfTop + '%</span></div>' +
        '<div class="bar"><span style="width:' + Math.max(s.pctOfTop, 1.5) + '%"></span></div>' +
        drop + '</div>';
    }).join('');
  }
  function feedTable(events, cols) {
    var rows = (events || []).map(function (e) {
      var tds = '<td class="ts">' + esc(timeAgo(e.timestamp)) + '</td>' +
        '<td class="ev">' + esc(e.event) + '</td>' +
        '<td>' + (e.page_id ? '<span class="pill">' + esc(e.page_id) + '</span>' : '') + '</td>';
      if (cols !== 'compact') {
        tds += '<td>' + esc(e.page_type || '') + '</td>' +
               '<td>' + esc(e.device || '') + '</td>';
      }
      return '<tr>' + tds + '</tr>';
    }).join('');
    var head = cols === 'compact'
      ? '<tr><th>Time</th><th>Event</th><th>page_id</th></tr>'
      : '<tr><th>Time</th><th>Event</th><th>page_id</th><th>type</th><th>device</th></tr>';
    var span = cols === 'compact' ? 3 : 5;
    return '<div class="feed-wrap"><table><thead>' + head + '</thead><tbody>' +
      (rows || '<tr><td class="notice" colspan="' + span + '">No events yet.</td></tr>') +
      '</tbody></table></div>';
  }

  // ── View renderer ──
  function renderActiveView() {
    var d = state.stats;
    var loading = '<div class="panel"><div class="notice">Loading…</div></div>';
    switch (state.view) {
      case 'overview':    $('view_overview').innerHTML = d ? renderOverview(d) : loading; break;
      case 'advertorial': $('view_advertorial').innerHTML = d ? renderAdvertorial(d) : loading; break;
      case 'funnel':      $('view_funnel').innerHTML = d ? renderFunnel(d) : loading; break;
      case 'campaigns':   $('view_campaigns').innerHTML = d ? renderCampaigns(d) : loading; break;
      case 'sales':       $('view_sales').innerHTML = d ? renderSales(d) : loading; break;
    }
  }

  // ── Overview ──
  function renderOverview(d) {
    var visits = (funnelStage(d, 'visits') || {}).count || 0;
    var cta = (funnelStage(d, 'cta_clicks') || {}).count || 0;
    var cr = visits ? (cta / visits * 100).toFixed(1) + '%' : '—';

    var cards = '<div class="grid cards section-gap">' +
      statCard('Events', fmt(d.totals.events)) +
      statCard('Sessions', fmt(d.totals.sessions)) +
      statCard('Users', fmt(d.totals.users)) +
      statCard('CTA → Visit CR', cr) +
      '</div>';

    var ts = d.timeseries || [];
    var max = ts.reduce(function (m, p) { return Math.max(m, p.count); }, 0) || 1;
    var spark = ts.map(function (p) {
      var h = Math.round((p.count / max) * 100);
      return '<div title="' + esc(p.day) + ': ' + p.count + '" style="height:' + h + '%"></div>';
    }).join('') || '<div class="notice">No data.</div>';

    var devRows = (d.byDevice || []).map(function (r) {
      return '<tr><td>' + esc(r.device) + '</td><td class="num">' + fmt(r.count) + '</td></tr>';
    }).join('') || '<tr><td class="notice" colspan="2">—</td></tr>';

    var row1 = '<div class="grid two section-gap">' +
      '<div class="panel"><h2>Funnel</h2>' + funnelHTML(d.funnel) + '</div>' +
      '<div class="panel"><h2>Events / day</h2><div class="spark">' + spark + '</div>' +
        '<div style="margin-top:14px;"><h2>By device</h2><table><tbody>' + devRows + '</tbody></table></div>' +
      '</div></div>';

    var evRows = (d.byEvent || []).map(function (r) {
      return '<tr><td class="ev">' + esc(r.event) + '</td><td class="num">' + fmt(r.count) + '</td></tr>';
    }).join('') || '<tr><td class="notice" colspan="2">—</td></tr>';
    var pageRows = (d.byPage || []).map(function (r) {
      return '<tr><td><span class="pill">' + esc(r.page_id) + '</span></td><td class="num">' + fmt(r.count) + '</td></tr>';
    }).join('') || '<tr><td class="notice" colspan="2">—</td></tr>';

    var row2 = '<div class="grid two section-gap">' +
      '<div class="panel"><h2>Top events</h2><table><thead><tr><th>Event</th><th class="num">Count</th></tr></thead><tbody>' + evRows + '</tbody></table></div>' +
      '<div class="panel"><h2>By page</h2><table><thead><tr><th>page_id</th><th class="num">Count</th></tr></thead><tbody>' + pageRows + '</tbody></table></div>' +
      '</div>';

    var live = '<div class="panel"><h2><span class="dot"></span>Live events</h2>' +
      feedTable(state.feed) + '</div>';

    return cards + row1 + row2 + live;
  }

  // ── Advertorial ──
  // Uses existing data: advertorial-relevant event counts + a page_type-filtered
  // live feed. Per-page_type aggregate segmentation arrives in Phase 2.
  function renderAdvertorial(d) {
    var readTime = eventCount(d, 'read_time_estimate');
    var scrolls = eventCount(d, 'scroll_depth');
    var ctaClicks = eventCount(d, 'cta_clicked');
    var ctaVisible = eventCount(d, 'cta_visible');

    var cards = '<div class="grid cards section-gap">' +
      statCard('Read-time pings', fmt(readTime), 'read_time_estimate') +
      statCard('Scroll events', fmt(scrolls), 'all scroll milestones') +
      statCard('CTA visible', fmt(ctaVisible)) +
      statCard('CTA clicks', fmt(ctaClicks)) +
      '</div>';

    // Filter the live feed to advertorial page_type (best-effort from recent events).
    var advEvents = (state.feed || []).filter(function (e) { return e.page_type === 'advertorial'; });
    var feed = '<div class="panel section-gap"><h2><span class="dot"></span>Advertorial live events</h2>' +
      (advEvents.length
        ? feedTable(advEvents)
        : '<div class="notice">No advertorial-tagged events in the recent feed.</div>') +
      '</div>';

    var note = '<div class="panel">' +
      comingSoon('Engagement-time & read-quality breakdown',
        'Average read time, scroll-depth distribution, and per-advertorial drop-off are computed from page_type-segmented queries added in Phase 2. The counts above are read live from the current /stats response.') +
      '</div>';

    return cards + feed + note;
  }

  // ── Funnel / Scroll ──
  function renderFunnel(d) {
    var funnel = '<div class="panel section-gap"><h2>Conversion funnel</h2>' + funnelHTML(d.funnel) + '</div>';

    var scrolls = eventCount(d, 'scroll_depth');
    var timeOnPage = eventCount(d, 'time_on_page');
    var exits = eventCount(d, 'exit_intent');
    var abandoned = eventCount(d, 'quiz_abandoned');

    var cards = '<div class="grid cards section-gap">' +
      statCard('Scroll events', fmt(scrolls)) +
      statCard('Time-on-page pings', fmt(timeOnPage)) +
      statCard('Exit intent', fmt(exits)) +
      statCard('Quiz abandoned', fmt(abandoned)) +
      '</div>';

    var scrollNote = '<div class="panel">' +
      comingSoon('Scroll depth 25 / 50 / 75 / 100 breakdown',
        'The tracker already sends scroll_percent on every scroll_depth event, but the current API collapses them into one count. Per-milestone scroll bars come from the Phase 2 query that groups by properties.scroll_percent.') +
      '</div>';

    return funnel + cards + scrollNote;
  }

  // ── Campaigns ──
  // Meta ad spend joined to PostHog purchase revenue by normalized campaign
  // name (utm_campaign). Data comes from /api/dashboard/campaign-roas, cached
  // in state.campaigns. `d` (state.stats) is unused here but kept for signature
  // parity with the other view renderers.
  function renderCampaigns(d) {
    var c = state.campaigns;
    if (!c) return '<div class="panel"><div class="notice">Loading campaign spend…</div></div>';
    if (!c.totals) return '<div class="panel"><h2>Campaigns</h2><div class="notice">' + esc(errText(c)) + '</div></div>';

    var t = c.totals;
    var cards = '<div class="grid cards section-gap">' +
      statCard('Spend', money(t.spend), c.currency || '') +
      statCard('Revenue', money(t.totalRevenue), 'matched + unattributed') +
      statCard('Blended ROAS', t.blendedRoas == null ? '—' : (t.blendedRoas + '×')) +
      statCard('Purchases', fmt(t.purchases)) +
      '</div>';

    var warn = (c.warnings && c.warnings.length)
      ? '<div class="panel section-gap" style="border-color:#5a4a23;background:#241f13;color:#f8e0b7;">' +
        c.warnings.map(function (w) { return '<div>⚠ ' + esc(w) + '</div>'; }).join('') + '</div>'
      : '';

    var matchedRows = (c.matched || []).map(function (m) {
      return '<tr>' +
        '<td>' + esc(m.campaign_name) + '</td>' +
        '<td class="num">' + money(m.spend) + '</td>' +
        '<td class="num">' + money(m.revenue) + '</td>' +
        '<td class="num">' + fmt(m.purchases) + '</td>' +
        '<td class="num">' + (m.cpa == null ? '—' : money(m.cpa)) + '</td>' +
        '<td class="num">' + (m.roas == null ? '—' : (m.roas + '×')) + '</td>' +
        '</tr>';
    }).join('') || '<tr><td class="notice" colspan="6">No campaigns matched by name yet.</td></tr>';

    var matchedTable = '<div class="panel section-gap"><h2>Campaign ROAS <span class="sub">(matched by campaign name)</span></h2>' +
      '<table><thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Revenue</th><th class="num">Purchases</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead><tbody>' +
      matchedRows + '</tbody></table></div>';

    var usRows = (c.unmatchedSpend || []).map(function (m) {
      return '<tr><td>' + esc(m.campaign_name) + '</td><td class="num">' + money(m.spend) + '</td></tr>';
    }).join('');
    var usTable = usRows
      ? '<div class="panel"><h2>Spend, no matched revenue</h2>' +
        '<table><thead><tr><th>Campaign</th><th class="num">Spend</th></tr></thead><tbody>' + usRows + '</tbody></table></div>'
      : '';

    var urRows = (c.unmatchedRevenue || []).map(function (u) {
      return '<tr><td>' + esc(u.campaign) + '</td><td class="num">' + money(u.revenue) + '</td><td class="num">' + fmt(u.purchases) + '</td></tr>';
    }).join('');
    var urTable = urRows
      ? '<div class="panel"><h2>Revenue, no matched spend</h2>' +
        '<table><thead><tr><th>utm_campaign</th><th class="num">Revenue</th><th class="num">Purch.</th></tr></thead><tbody>' + urRows + '</tbody></table></div>'
      : '';

    var twoCol = (usTable || urTable) ? '<div class="grid two section-gap">' + usTable + urTable + '</div>' : '';

    return cards + warn + matchedTable + twoCol;
  }

  // ── Sales ──
  function renderSales(d) {
    var checkouts = (funnelStage(d, 'checkouts') || {}).count || 0;
    var purchases = (funnelStage(d, 'purchases') || {}).count || 0;
    var cta = (funnelStage(d, 'cta_clicks') || {}).count || 0;
    var checkoutCR = cta ? (checkouts / cta * 100).toFixed(1) + '%' : '—';

    // Revenue cards come from the campaign-roas join (state.campaigns); they
    // render as '—' until both Meta spend and PostHog are configured/loaded.
    var c = state.campaigns;
    var t = (c && c.totals) ? c.totals : null;
    var aov = (t && t.purchases) ? money(t.totalRevenue / t.purchases) : '—';

    var revCards = '<div class="grid cards section-gap">' +
      statCard('Revenue', t ? money(t.totalRevenue) : '—', t ? (c.currency || '') : 'needs Meta + PostHog') +
      statCard('Ad spend', t ? money(t.spend) : '—') +
      statCard('Blended ROAS', (t && t.blendedRoas != null) ? (t.blendedRoas + '×') : '—') +
      statCard('AOV', aov) +
      '</div>';

    var funnelCards = '<div class="grid cards section-gap">' +
      statCard('CTA clicks', fmt(cta)) +
      statCard('Checkouts', fmt(checkouts)) +
      statCard('Purchases', fmt(purchases)) +
      statCard('CTA → Checkout', checkoutCR) +
      '</div>';

    // Recent purchase events from the live feed (server-side mirror).
    var purchaseEvents = (state.feed || []).filter(function (e) { return e.event === 'purchase'; });
    var feed = '<div class="panel section-gap"><h2><span class="dot"></span>Recent purchases</h2>' +
      (purchaseEvents.length
        ? feedTable(purchaseEvents, 'compact')
        : '<div class="notice">No purchase events in the recent feed yet.</div>') +
      '</div>';

    var note = t
      ? '<div class="panel"><div class="sub">Revenue is summed from PostHog purchase <code>value</code>. ROAS and AOV blend matched + unattributed revenue over Meta spend — see <strong>Campaigns</strong> for the per-campaign join and the unattributed split.</div></div>'
      : '<div class="panel">' +
        comingSoon('Revenue, AOV & ROAS',
          'Revenue cards populate once both Meta spend and PostHog are configured. Open Campaigns for the per-campaign join and unattributed revenue.') +
        '</div>';

    return revCards + funnelCards + feed + note;
  }

  // ── Boot: probe auth by hitting a protected route ──
  fetch('/api/dashboard/events?limit=1').then(function (r) {
    if (r.ok) enterApp();
    else { show(loginEl); $('pw').focus(); }
  }).catch(function () { show(loginEl); });
})();
</script>
</body>
</html>
